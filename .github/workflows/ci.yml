name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Fast fail: type safety + lint, independent of tests/build.
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint

  # Unit + integration + core coverage gate.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Unit tests
        run: npm run test:run
      - name: Core coverage gate (src/lib utilities + auth)
        run: npm run test:coverage:core
      - name: Critical-path coverage gate (per-file thresholds)
        run: npm run test:coverage:critical

  # Production build (Turbopack). Independent of tests.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Production build
        run: npm run build

  # Real-browser E2E (Playwright: landing + axe). Needs a build for `next start`.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E
        run: npm run test:e2e

  # Container build validation — gated on the quality trio.
  docker:
    runs-on: ubuntu-latest
    needs: [static, test, build]
    steps:
      - uses: actions/checkout@v4
      - name: Container build validation
        run: docker build -t promptperfect:ci .

